<title>Julio Rangel · AI & Full-Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fbf8ff; --surface:#ffffff; --text:#1d1638; --muted:#5d5384;
  --edge:#1d1638; --coral:#e8502d; --mint:#0f9f83; --sun:#f2b705; --violet:#5b46e0;
  --chip:#efe9ff; --on-accent:#ffffff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1530; --surface:#241d42; --text:#f4f0ff; --muted:#b4abd6;
    --edge:#7d6ff0; --coral:#ff7a59; --mint:#4fe3c1; --sun:#ffd35c; --violet:#9d90ff;
    --chip:#2f2757; --on-accent:#1a1530;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1530; --surface:#241d42; --text:#f4f0ff; --muted:#b4abd6;
  --edge:#7d6ff0; --coral:#ff7a59; --mint:#4fe3c1; --sun:#ffd35c; --violet:#9d90ff;
  --chip:#2f2757; --on-accent:#1a1530;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
svg{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--edge)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;margin-right:auto}
.logo svg{width:28px;height:28px;fill:var(--text)}
nav{display:flex;gap:4px}
nav a{padding:6px 11px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:var(--muted)}
nav a:hover{background:var(--chip);color:var(--text)}
nav a[aria-current="true"]{background:var(--text);color:var(--bg)}
.ctl{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:2px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--edge)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn svg{width:18px;height:18px}
.btn.solid{background:var(--coral);color:var(--on-accent)}
.btn.icon{padding:9px}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--edge)}
.seg button{font:inherit;font-weight:600;font-size:13px;border:0;padding:8px 11px;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* hero */
.hero{padding:64px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.25fr .85fr;gap:44px;align-items:center}
.hi{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14px;background:var(--chip);border:2px solid var(--edge);border-radius:999px;padding:5px 14px}
.hi .wave{display:inline-block;transform-origin:70% 70%;animation:wave 1.8s ease-in-out 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
h1{font-size:clamp(52px,9vw,104px);font-weight:800;letter-spacing:-.035em;margin:18px 0 10px}
h1 span{display:block}
h1 .last{color:var(--violet)}
.typed{font-family:var(--mono);font-size:clamp(16px,2.2vw,20px);min-height:1.7em;color:var(--mint)}
.typed::after{content:"";display:inline-block;width:.6ch;height:1.1em;background:var(--coral);margin-left:3px;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{max-width:52ch;margin:18px 0 26px;color:var(--muted);font-size:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px}

.card{background:var(--surface);border:2px solid var(--edge);border-radius:20px;box-shadow:7px 7px 0 var(--edge);padding:24px;position:relative}
.profile .top{display:flex;gap:16px;align-items:center}
.avatar{width:84px;height:84px;flex:none}
.profile h3{font-size:24px;letter-spacing:-.01em}
.profile .sub{color:var(--muted);font-size:15px}
.rows{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.rows li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.rows svg{width:18px;height:18px;margin-top:3px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mint);margin-top:7px;flex:none;box-shadow:0 0 0 0 var(--mint);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sticker{position:absolute;top:-16px;right:18px;background:var(--sun);color:#1d1638;font-weight:700;font-size:13px;border:2px solid var(--edge);border-radius:10px;padding:3px 10px;transform:rotate(4deg)}

/* sections */
section{padding:56px 0}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.head h2{font-size:clamp(32px,5vw,48px);letter-spacing:-.025em}
.head p{color:var(--muted)}

/* timeline */
.tl{display:grid;gap:22px;border-left:3px solid var(--edge);margin-left:8px;padding-left:28px}
.job{position:relative}
.job::before{content:"";position:absolute;left:-39px;top:26px;width:17px;height:17px;border-radius:50%;background:var(--coral);border:3px solid var(--edge)}
.job.edu::before{background:var(--mint)}
.job .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.job h3{font-size:24px;letter-spacing:-.01em}
.when{font-family:var(--mono);font-size:13px;background:var(--chip);border-radius:8px;padding:3px 9px}
.org{color:var(--violet);font-weight:600;margin:4px 0 10px}
.job ul{margin:0;padding-left:20px;color:var(--muted)}
.job li{margin:5px 0}
.repo .banner{display:inline-flex;align-self:flex-start;align-items:center;border:2px solid var(--edge);border-radius:12px;background:#df7448;padding:6px 14px;line-height:0}
.repo .banner img{display:block;height:30px;width:auto;max-width:100%}
.logo-tile{display:inline-flex;align-items:center;background:#f5f7fd;border:2px solid var(--edge);border-radius:12px;padding:6px 14px}
.logo-tile img{display:block;height:30px;width:auto}
.now{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:14px;color:var(--muted)}
.job .logo-tile{margin:10px 0 2px}
.job .logo-tile img{height:34px}
.job li a,.repo .name a{color:var(--violet);font-weight:600;text-underline-offset:3px}
.repo .name a{text-decoration:none}
.repo .name a:hover{text-decoration:underline}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-family:var(--mono);font-size:13px;font-weight:500;border:2px solid var(--edge);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--chip)}
.chip[aria-pressed="true"]{background:var(--violet);color:var(--on-accent)}
.count{color:var(--muted);font-size:14px;margin-bottom:18px;min-height:1.5em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.repo{display:flex;flex-direction:column;gap:12px;padding:20px;box-shadow:5px 5px 0 var(--edge)}
.repo[hidden]{display:none}
.repo .name{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:15px;font-weight:500;color:var(--violet)}
.repo .name svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.repo .badge{margin-left:auto;font-size:11px;border:1.5px solid var(--edge);border-radius:999px;padding:1px 9px;color:var(--muted);font-family:var(--body)}
.repo p{color:var(--muted);font-size:15.5px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.tags span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,var(--coral));border:1.5px solid var(--edge)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.skills .card{box-shadow:5px 5px 0 var(--edge);padding:20px}
.skills h3{font-size:20px;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{background:var(--chip);border-radius:8px;padding:4px 10px;font-size:14.5px;font-weight:500;transition:transform .12s}
.pills span:hover{transform:rotate(-3deg) scale(1.06)}

/* contact */
.contact .card{text-align:left;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;background:var(--sun);color:#1d1638;border-color:var(--edge)}
.contact h2{font-size:clamp(30px,5vw,46px);letter-spacing:-.025em;max-width:16ch}
.contact .btn{background:#fff;color:#1d1638;border-color:#1d1638;box-shadow:3px 3px 0 #1d1638}
.contact .btn:hover{box-shadow:5px 5px 0 #1d1638}
.links{display:flex;flex-wrap:wrap;gap:12px}
footer{padding:30px 0 50px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr}
  nav{display:none}
  .hero{padding-top:40px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}
@media print{
  .bar,.cta,.filters,.count,.sticker,.contact .links{display:none!important}
  :root{--bg:#fff;--surface:#fff;--text:#111;--muted:#444;--edge:#111;--chip:#eee}
  .card,.btn,.seg{box-shadow:none!important}
  section{padding:22px 0;break-inside:avoid}
  .hero{padding:10px 0}
  .typed::after{display:none}
  .contact .card{background:#fff}
}
</style>

    org:{en:"Escuela Nacional de Directores Técnicos (ENDIT)",es:"Escuela Nacional de Directores Técnicos (ENDIT)"},
    bullets:{
      en:["Soccer coaching credential; I still enjoy sports analysis."],
      es:["Credencial de dirección técnica de fútbol; sigo disfrutando el análisis deportivo."]}}
];

var PROJECTS = [
  { name:"kinessa", logo:true, badge:"Live", url:"https://kinessa.com.mx", tags:["Full-stack","UX"], c:"#5b46e0",
    d:{en:"Live app for personal trainers, nutritionists and their clients, with 60+ users. Onboarding, registration and install guide included.",es:"App en funcionamiento para entrenadores, nutriólogos y sus clientes, con más de 60 usuarios. Incluye onboarding, registro y guía de instalación."}},
  { name:"safegate", badge:"CV", tags:["Python","OpenCV","PostgreSQL"], c:"#3572A5",
    d:{en:"Facial-recognition access control. I designed the database schema and the overall architecture.",es:"Control de acceso con reconocimiento facial. Diseñé el esquema de base de datos y la arquitectura."}},
  { name:"sapal-water-demand", badge:"ML", tags:["Python","LSTM","Deep Learning"], c:"#3572A5",
    d:{en:"LSTM model that forecasts urban water demand for SAPAL in León.",es:"Modelo LSTM que pronostica la demanda urbana de agua para SAPAL en León."}}
];

var SKILLS = [
  { t:{en:"Languages",es:"Lenguajes"}, i:["Python","PHP","C#","JavaScript","SQL"] },
  { t:{en:"Frameworks",es:"Frameworks"}, i:["FastAPI","Flask","Streamlit","Reflex","React","PyQt"] },
  { t:{en:"AI & data",es:"IA y datos"}, i:["Machine Learning","NLP","Computer Vision","LSTM","OpenCV","pandas","NumPy"] },
  { t:{en:"Platforms",es:"Plataformas"}, i:["PostgreSQL","Google Cloud","Stripe Connect","Odoo","Unity XR"] }
];

var lang = "en", activeTag = null, typeTimer = null;
var $ = function(s){return document.querySelector(s)};
var store = {
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

function applyLinks(){
  ["l-gh","c-gh"].forEach(function(id){$("#"+id).href=LINKS.github});
  ["l-li","c-li"].forEach(function(id){$("#"+id).href=LINKS.linkedin});
  ["l-mail","c-mail"].forEach(function(id){$("#"+id).href=LINKS.email});
}

function renderTimeline(){
  $("#timeline").innerHTML = JOBS.map(function(j){
    return '<article class="card job '+j.kind+'" style="box-shadow:5px 5px 0 var(--edge)">'+
      '<div class="row"><h3>'+j.title[lang]+'</h3><span class="when">'+j.when[lang]+'</span></div>'+
      (j.logo?'<div class="logo-tile"><img src="'+PROMO_LOGO+'" alt="Promoshare"></div>':'')+
      '<div class="org">'+j.org[lang]+'</div>'+
      '<ul>'+j.bullets[lang].map(function(b){return '<li>'+b+'</li>'}).join('')+'</ul></article>';
  }).join('');
}

var REPO_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2V4z"/><path d="M5 17a2 2 0 0 1 2-2h12"/></svg>';

function renderFilters(){
  var set = {};
  PROJECTS.forEach(function(p){p.tags.forEach(function(t){set[t]=1})});
  var tags = Object.keys(set);
  var html = '<button type="button" class="chip" data-tag="" aria-pressed="'+(activeTag===null)+'">'+T[lang].all+'</button>';
  html += tags.map(function(t){return '<button type="button" class="chip" data-tag="'+t+'" aria-pressed="'+(activeTag===t)+'">'+t+'</button>'}).join('');
  $("#filters").innerHTML = html;
}

function renderProjects(){
  $("#grid").innerHTML = PROJECTS.map(function(p){
    var show = !activeTag || p.tags.indexOf(activeTag)>-1;
    return '<article class="card repo"'+(show?'':' hidden')+'>'+
      (p.logo?'<a class="banner" href="'+p.url+'" target="_blank" rel="noopener" aria-label="Kinessa"><img src="'+KINESSA_LOGO+'" alt="Kinessa"></a>':'')+
      '<div class="name">'+REPO_ICON+(p.url?'<a href="'+p.url+'" target="_blank" rel="noopener">'+p.name+'</a>':'<span>'+p.name+'</span>')+'<span class="badge">'+p.badge+'</span></div>'+
      '<p>'+p.d[lang]+'</p>'+
      '<div class="tags">'+p.tags.map(function(t,i){
        return '<span>'+(i===0?'<i class="dot" style="--c:'+p.c+'"></i>':'')+t+'</span>';
      }).join('')+'</div></article>';
  }).join('');
  var n = PROJECTS.filter(function(p){return !activeTag || p.tags.indexOf(activeTag)>-1}).length;
  $("#count").textContent = activeTag ? T[lang].showing(n,PROJECTS.length) : "";
}

function renderSkills(){
  $("#skillgrid").innerHTML = SKILLS.map(function(g){
    return '<div class="card"><h3>'+g.t[lang]+'</h3><div class="pills">'+
      g.i.map(function(s){return '<span>'+s+'</span>'}).join('')+'</div></div>';
  }).join('');
}

function typeRoles(){
  clearTimeout(typeTimer);
  var el = $("#typed"), roles = T[lang].roles;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = "> " + roles[0]; return; }
  var r = 0, c = 0, del = false;
  (function tick(){
    var word = roles[r];
    el.textContent = "> " + word.slice(0,c);
    var wait = del ? 28 : 55;
    if(!del && c === word.length){ del = true; wait = 1500; }
    else if(del && c === 0){ del = false; r = (r+1)%roles.length; wait = 350; }
    else { c += del ? -1 : 1; }
    typeTimer = setTimeout(tick, wait);
  })();
}

function setLang(l){
  lang = l; store.set("cv-lang", l);
  document.documentElement.lang = l;
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed", String(b.dataset.lang===l))});
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var v = T[l][el.dataset.i18n]; if (typeof v === "string") el.textContent = v;
  });
  renderTimeline(); renderFilters(); renderProjects(); renderSkills(); typeRoles();
}

document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.dataset.lang) });
});
$("#filters").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if(!b) return;
  activeTag = b.dataset.tag || null;
  renderFilters(); renderProjects();
});
$("#theme").addEventListener("click", function(){
  var root = document.documentElement;
  var dark = root.dataset.theme ? root.dataset.theme==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("cv-theme", root.dataset.theme);
});
$("#pdf").addEventListener("click", function(){ try{ window.print() }catch(e){} });

/* scrollspy */
var links = document.querySelectorAll("#nav a");
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      links.forEach(function(a){ a.setAttribute("aria-current", String(a.getAttribute("href")==="#"+en.target.id)) });
    }
  });
},{rootMargin:"-40% 0px -55% 0px"});
document.querySelectorAll("main section[id]").forEach(function(s){io.observe(s)});

/* init */
var savedTheme = store.get("cv-theme"); if(savedTheme) document.documentElement.dataset.theme = savedTheme;
applyLinks();
$("#hero-logo").src = PROMO_LOGO;
var saved = store.get("cv-lang");
setLang(saved || ((navigator.language||"en").toLowerCase().indexOf("es")===0 ? "es" : "en"));
</script>
</body>
</html>
